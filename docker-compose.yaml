services:
  database:
    image: postgres:17
    container_name: databaseContainer
    ports:
      - 5432:5432
    env_file:
      - ./Secrets/.env
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: backendContainer
    ports: 
      - 8000:3000
    env_file:
      - ./Secrets/.env
    volumes:
      - ./backend:/app
      - /app/node_modules
    depends_on:
      database:
        condition: service_healthy
  
  frontend:
    build: ./frontend
    container_name: frontendContainer
    ports:
      - 3000:3000
    env_file:
      - ./Secrets/.env
    volumes:
      - ./frontend:/app
      - /app/node_modules
    


volumes:
  pg_data: